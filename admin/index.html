<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Konfirmasi Kehadiran OTP</title>
<meta name="theme-color" content="#070a14">
<link rel="icon" href="/assets/logo-otp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#06070c;--navy:#0b1430;--gold:#d6b16a;--gold2:#f4dfae;--gold3:#9c7a3c;--ink:#f3ecdd;--muted:#a7adc0;--line:rgba(214,177,106,.32);--card:rgba(255,255,255,.035)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--black)}
body{min-height:100vh;color:var(--ink);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:var(--black) radial-gradient(ellipse 140% 60% at 50% 0%,#14224e 0%,#0a1128 45%,var(--black) 100%) no-repeat}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 60px}
.goldtext{background:linear-gradient(180deg,var(--gold2),var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{letter-spacing:.3em;text-transform:uppercase;font-size:11px;font-weight:600;color:var(--gold)}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
header img{width:72px;height:auto}
h1{font:700 clamp(20px,5.5vw,28px) Cinzel,serif;line-height:1.15}
.card{background:linear-gradient(180deg,rgba(19,32,74,.55),rgba(6,7,12,.55));border:1px solid var(--line);border-radius:20px;padding:20px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:1px solid var(--gold);
  background:rgba(214,177,106,.08);color:var(--gold2);font:600 12px Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn.solid{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--black)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:16px Montserrat,sans-serif;letter-spacing:.2em;text-align:center}
#login{max-width:340px;margin:12vh auto 0;text-align:center;display:grid;gap:14px}
#login p{color:var(--muted);font-size:13px}
.err{color:#ff9b9b;font-size:13px;min-height:18px}
#dash[hidden],#login[hidden]{display:none}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;background:var(--card)}
.stat b{display:block;font:700 26px Cinzel,serif}
.stat small{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;display:flex;margin:-4px 0 18px}
.bar i{display:block;height:100%}
.bar .y{background:linear-gradient(90deg,var(--gold3),var(--gold2))}
.bar .n{background:#5b6178}

.tools{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.tools .upd{margin-left:auto;font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font:600 11px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab.on{background:var(--gold);color:var(--black);border-color:var(--gold)}

.grp{margin-bottom:22px}
.gh{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.gh b{margin-left:auto;font:700 16px Cinzel,serif;color:var(--gold2);letter-spacing:0}
.dot{width:8px;height:8px;border-radius:50%}
.dot.yes{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dot.no{background:#6b7189}
.dot.pending{border:1px dashed var(--gold)}
.bubbles{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:14px 8px}
.bub{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bub i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font:700 15px Cinzel,serif;font-style:normal}
.bub.yes i{background:linear-gradient(160deg,var(--gold2),var(--gold) 55%,var(--gold3));color:var(--black);box-shadow:0 4px 18px rgba(214,177,106,.35)}
.bub.no i{background:rgba(255,255,255,.04);border:1px solid rgba(167,173,192,.35);color:#8a90a6}
.bub.pending i{border:1px dashed var(--line);color:var(--gold);background:rgba(214,177,106,.04)}
.bub small{font-size:10px;color:var(--muted);line-height:1.3;max-width:70px}
.empty{color:var(--muted);font-size:12px;font-style:italic}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid rgba(214,177,106,.12);vertical-align:top}
td .r{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pill.yes{background:var(--gold);color:var(--black)}
.pill.no{background:#3a3f52;color:#c9cde0}
.pill.pending{border:1px dashed var(--line);color:var(--gold)}
td.t{color:var(--muted);font-size:11px;white-space:nowrap}
h2{font:700 18px Cinzel,serif;margin:26px 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/assets/logo-otp.png" alt="OTP">
    <div><div class="eyebrow">Panitia · Admin</div><h1 class="goldtext">Konfirmasi Kehadiran</h1></div>
  </header>

  <form id="login" hidden>
    <div class="eyebrow">Masuk Admin</div>
    <p>Masukkan PIN admin untuk melihat daftar konfirmasi.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required>
    <div class="err" id="err"></div>
    <button class="btn solid" type="submit">Lihat Daftar</button>
  </form>

  <section id="dash" hidden>
    <div class="stats">
      <div class="stat"><b class="goldtext" id="s-yes">0</b><small>Hadir</small></div>
      <div class="stat"><b id="s-no" style="color:#c9cde0">0</b><small>Berhalangan</small></div>
      <div class="stat"><b id="s-pending" style="color:var(--gold)">0</b><small>Belum</small></div>
      <div class="stat"><b id="s-all">0</b><small>Diundang</small></div>
    </div>
    <div class="bar"><i class="y" id="b-yes"></i><i class="n" id="b-no"></i></div>

    <div class="tools">
      <button class="btn" id="refresh" type="button">↻ Refresh</button>
      <button class="btn" id="copy" type="button">Salin Rekap</button>
      <span class="upd" id="upd"></span>
    </div>

    <div class="card">
      <div class="grp"><div class="gh"><span class="dot yes"></span>Hadir <b id="n-yes">0</b></div><div class="bubbles" id="g-yes"></div></div>
      <div class="grp"><div class="gh"><span class="dot no"></span>Berhalangan <b id="n-no">0</b></div><div class="bubbles" id="g-no"></div></div>
      <div class="grp" style="margin-bottom:0"><div class="gh"><span class="dot pending"></span>Belum konfirmasi <b id="n-pending">0</b></div><div class="bubbles" id="g-pending"></div></div>
    </div>

    <h2 class="goldtext">Detail</h2>
    <div class="tabs" id="tabs">
      <button class="tab on" data-f="all">Semua</button><button class="tab" data-f="yes">Hadir</button><button class="tab" data-f="no">Berhalangan</button><button class="tab" data-f="pending">Belum</button>
    </div>
    <div class="card" style="margin-top:12px;padding:8px 10px">
      <table><thead><tr><th>Nama</th><th>Status</th><th>Waktu</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "otp-admin-pin";
const LABEL = {yes: "Hadir", no: "Berhalangan", pending: "Belum"};
let pin = ""; try { pin = sessionStorage.getItem(KEY) || ""; } catch (e) {}
let data = [], filter = "all";

const initials = n => {
  const w = n.split(/\s+/).filter(x => /^[A-Za-zÀ-ÿ]/.test(x) && !/\./.test(x));
  return ((w[0] || "")[0] + (w.length > 1 ? w[1][0] : (w[0] || "")[1] || "")).toUpperCase();
};
const fmt = t => t ? new Date(t).toLocaleString("id-ID", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Asia/Jakarta"}) : "—";

async function load(showErr) {
  try {
    const r = await fetch("/api/rsvp", {headers: {"x-admin-pin": pin}, cache: "no-store"});
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { logout(showErr ? "PIN salah." : ""); return; }
    if (!j.ok) {
      const msg = {admin_pin_not_configured: "ADMIN_PIN belum diatur di Vercel (Settings → Environment Variables).",
                   storage_not_configured: "Database belum ditambahkan di Vercel (Storage → Upstash for Redis).",
                   storage_error: "Database tidak bisa dihubungi. Coba lagi sebentar."}[j.error] || "Gagal memuat data.";
      logout(msg); return;
    }
    data = j.guests; render();
    $("login").hidden = true; $("dash").hidden = false;
    try { sessionStorage.setItem(KEY, pin); } catch (e) {}
  } catch (e) { logout("Tidak bisa terhubung ke server."); }
}
function logout(msg) {
  $("dash").hidden = true; $("login").hidden = false; $("err").textContent = msg || "";
  try { sessionStorage.removeItem(KEY); } catch (e) {}
}
function render() {
  const st = g => g.status || "pending";
  const groups = {yes: [], no: [], pending: []};
  data.forEach(g => groups[st(g)].push(g));
  for (const k in groups) {
    $("n-" + k).textContent = $("s-" + k).textContent = groups[k].length;
    $("g-" + k).innerHTML = groups[k].length
      ? groups[k].map(g => `<div class="bub ${k}" title="${esc(g.name)} · ${esc(g.role)}"><i>${esc(initials(g.name))}</i><small>${esc(g.name)}</small></div>`).join("")
      : `<div class="empty">Belum ada</div>`;
  }
  $("s-all").textContent = data.length;
  $("b-yes").style.width = (groups.yes.length / data.length * 100) + "%";
  $("b-no").style.width = (groups.no.length / data.length * 100) + "%";
  const rows = data.filter(g => filter === "all" || st(g) === filter)
    .sort((a, b) => (b.at || 0) - (a.at || 0));
  $("rows").innerHTML = rows.map(g => `<tr><td>${esc(g.name)}<span class="r">${esc(g.role)}</span></td><td><span class="pill ${st(g)}">${LABEL[st(g)]}</span></td><td class="t">${fmt(g.at)}</td></tr>`).join("");
  $("upd").textContent = "Diperbarui " + new Date().toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"});
}
$("login").addEventListener("submit", e => { e.preventDefault(); pin = $("pin").value.trim(); load(true); });
$("refresh").onclick = () => load();
$("tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (!t) return;
  filter = t.dataset.f; document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t)); render(); });
$("copy").onclick = () => {
  const by = k => data.filter(g => (g.status || "pending") === k).map((g, i) => `${i + 1}. ${g.name} (${g.role})`).join("\n") || "-";
  const txt = `REKAP KEHADIRAN — Graduation Ceremony OTP Ora Mingkuh 2026\n\nHADIR (${data.filter(g => g.status === "yes").length}):\n${by("yes")}\n\nBERHALANGAN (${data.filter(g => g.status === "no").length}):\n${by("no")}\n\nBELUM KONFIRMASI (${data.filter(g => !g.status).length}):\n${by("pending")}`;
  navigator.clipboard?.writeText(txt).then(() => { $("copy").textContent = "Tersalin ✓"; setTimeout(() => $("copy").textContent = "Salin Rekap", 1500); });
};
if (pin) load(); else $("login").hidden = false;
setInterval(() => { if (pin && !document.hidden && !$("dash").hidden) load(); }, 30000);
</script>
</body>
</html>
